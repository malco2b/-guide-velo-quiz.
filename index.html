<script>
const $=(s)=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,9), esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const TYPES={qcm:['QCM','Question à choix : le guide valide les bonnes réponses'],vf:['Vrai / Faux','Les joueurs votent, puis révélation'],est:['Estimation','Le plus proche du nombre gagne'],fast:['Rapidité','Le premier à répondre gagne'],duel:['Duel','Deux joueurs, le guide désigne le vainqueur'],allin:['All-in','Un joueur mise tout : doublé ou perdu'],vol:['Vol de points','Le gagnant vole X points à un autre'],pari:['Pari secret','Mises secrètes, puis résultat par joueur'],free:['Défi du guide','Ton propre jeu : règles, gain, perte']};
const NAMES=['Joueur 1','Joueur 2','Joueur 3'];
function mk(s){return String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(name=>({id:uid(),name}))}
function seed(){const photo=(src,q)=>'';const g=(type,q,ans,o,expl,src,diff)=>({type,q,ans,opts:o||[],pts:1,stake:false,expl:expl||'',src:src||'',diff:diff||1,time:20,image:photo(src,q)});
const P='Destination Pornic';
const STOP_PHOTOS={
  'Lanterne des morts':'assets/lanterne-morts.jpg',
  'Marais salant':'assets/tenue-mareil.jpg',
  "Plan d’eau Maurice-Giros":'assets/plan-eau-maurice-giros.webp',
  'La Rogère':'assets/la-rogere.jpg',
  'Château de Pornic':'assets/chateau-pornic.jpg'
};
const stopPhoto=(name)=>Object.entries(STOP_PHOTOS).find(([label])=>name.includes(label))?.[1]||'';
const st=(name,tell,show,priv,facts,bank)=>{const b=bank||[];const photo=stopPhoto(name);if(photo)b.forEach(q=>q.image=photo);return {id:uid(),name,tell,show,priv,facts,game:null,bank:b}};
return{dark:null,routes:[{id:uid(),name:'Les Moutiers → La Bernerie → Pornic',desc:'Parcours guide du 8 octobre — 5 étapes dans l’ordre du trajet',date:'2026-10-08',time:'14:00',dur:'3h',guide:'',mode:'competition',points:true,settings:{streak:false,speedBonus:false,shuffle:false},players:mk('Joueur 1\nJoueur 2\nJoueur 3\nJoueur 4\nJoueur 5\nJoueur 6\nJoueur 7'),run:null,steps:[
st('1. Lanterne des morts — Les Moutiers-en-Retz','Monument classé en 1913, haut de 7 m et placé dans l’ancien cimetière. La lanterne possède trois ouvertures et reste encore allumée lors de certaines commémorations.','Observer la tour, ses ouvertures et sa forme.','Faire répondre avant de donner l’explication.',['7 m','Classée en 1913','Trois ouvertures','Toujours utilisée'],[
g('qcm','Combien d’ouvertures possède la partie haute de la Lanterne des morts ?','3',['3','4','5','6'],'La lanterne possède trois ouvertures.','Mairie des Moutiers-en-Retz — panneau patrimoine'),
g('qcm','Quel est approximativement le diamètre de la tour ?','1,50 mètre',['1,50 mètre','2,20 mètres','3 mètres','4,50 mètres'],'Le monument mesure environ 1,50 m de diamètre pour 7 m de haut.','Mairie des Moutiers-en-Retz — panneau patrimoine'),
g('qcm','Quelle statue se trouve dans la niche extérieure de la lanterne ?','Saint Joseph',['Saint Joseph','Saint Pierre','Saint Nicolas','Saint Benoît'],'La niche extérieure abrite saint Joseph, présenté comme le « patron de la bonne mort ».','Mairie des Moutiers-en-Retz — panneau patrimoine'),
g('qcm','À quelle date la lanterne est-elle traditionnellement allumée pour la commémoration des défunts ?','Le 2 novembre',['Le 2 novembre','Le 1er novembre','Le 11 novembre','Le 15 août'],'Elle est notamment allumée le 2 novembre, jour de la commémoration des défunts.','Mairie des Moutiers-en-Retz — panneau patrimoine'),
g('vf','La Lanterne des morts des Moutiers est aujourd’hui la dernière encore utilisée dans le département.','Vrai',[],'Le panneau patrimonial de la commune la présente comme la dernière encore utilisée dans le département.','Mairie des Moutiers-en-Retz — panneau patrimoine')]),
st('2. Marais salant — Tenue de Mareil','Saline réhabilitée au début des années 2000. L’histoire locale du sel remonte à l’époque gauloise et la baie de Bourgneuf fut un important territoire salicole.','Observer les bassins et le cheminement de l’eau.','Rester sur les accès autorisés.',['Réhabilitation 2000-2001','Hanse teutonique','Fours à sel gaulois','Baie de Bourgneuf'],[
g('qcm','À quelle période l’association P2MB a-t-elle réhabilité la Tenue de Mareil ?','2000-2001',['2000-2001','1984-1985','1992-1993','2011-2012'],'La mairie indique que P2MB a réhabilité le marais salant en 2000-2001.','Mairie des Moutiers-en-Retz — P2MB'),
g('qcm','Au Moyen Âge, quelle organisation commerciale venait chercher le sel de la baie pour conserver notamment les harengs de la Baltique ?','La Hanse teutonique',['La Hanse teutonique','La Compagnie des Indes','La Ligue hanséatique française','L’Ordre de Malte'],'La Hanse teutonique envoyait ses navires chercher le sel de la baie.','Mairie des Moutiers-en-Retz — histoire du sel'),
g('qcm','Avant la technique des marais salants, comment les Gaulois produisaient-ils du sel ici ?','En chauffant l’eau de mer dans des fours',['En chauffant l’eau de mer dans des fours','En broyant des roches salées','En congelant l’eau de mer','En récupérant uniquement le sel des algues'],'Des fours à sel permettaient de chauffer l’eau de mer jusqu’à cristallisation.','Mairie des Moutiers-en-Retz — fours à sel gaulois'),
g('qcm','À quoi servait surtout le sel à l’époque gauloise, en plus de l’alimentation ?','À conserver viandes et poissons',['À conserver viandes et poissons','À fabriquer du verre','À teindre les voiles','À imperméabiliser les bateaux'],'Le sel était essentiel pour conserver les viandes et les poissons.','Mairie des Moutiers-en-Retz — fours à sel gaulois'),
g('vf','L’exploitation du sel aux Moutiers s’est interrompue pendant environ un demi-siècle avant de reprendre au début du XXIe siècle.','Vrai',[],'La commune indique une reprise de l’activité saunière au début du troisième millénaire après environ un demi-siècle d’arrêt.','Mairie des Moutiers-en-Retz — histoire du sel')]),
st('3. Plan d’eau Maurice-Giros — La Bernerie-en-Retz','Plan d’eau de mer de 2,5 hectares construit en 1989. Il permet la baignade quelle que soit la marée et nécessite des vidanges régulières pour son entretien.','Observer le bassin, la plage et les équipements autour.','Parking vélo disponible à proximité.',['2,5 hectares','Construit en 1989','Vidanges régulières','Baignade à toute heure'],[
g('qcm','Quelle combinaison décrit correctement le plan d’eau Maurice-Giros ?','2,5 ha et construit en 1989',['2,5 ha et construit en 1989','1,5 ha et construit en 1979','3,5 ha et construit en 1999','5 ha et construit en 1985'],'La commune indique une superficie de 2,5 hectares et une construction en 1989.','Mairie de La Bernerie-en-Retz — Littoral'),
g('qcm','En été, à quelle fréquence environ le plan d’eau est-il vidé pour son entretien ?','Tous les quinze jours',['Tous les quinze jours','Chaque semaine','Une fois par mois','Une fois par saison'],'La commune indique une vidange tous les quinze jours en période estivale.','Mairie de La Bernerie-en-Retz — Littoral'),
g('qcm','Et en hiver, à quelle fréquence environ est-il vidé ?','Tous les mois',['Tous les mois','Tous les quinze jours','Tous les deux mois','Deux fois par semaine'],'En hiver, l’entretien prévoit une vidange environ tous les mois.','Mairie de La Bernerie-en-Retz — Littoral'),
g('qcm','Parmi ces activités, laquelle est explicitement proposée en initiation sur le plan d’eau ?','L’optimist',['L’optimist','Le ski nautique','La plongée bouteille','Le jet-ski'],'La commune cite notamment l’optimist, la planche à voile et le paddle.','Mairie de La Bernerie-en-Retz — Littoral'),
g('vf','Le plan d’eau permet de se baigner même lorsque la marée est basse.','Vrai',[],'Son intérêt est précisément de permettre la baignade à toute heure, indépendamment de la marée.','Mairie de La Bernerie-en-Retz — Littoral')]),
st('4. La Rogère — Stèle du Chemin de la Mémoire 39-45','Le 29 novembre 1944, un échange exceptionnel de prisonniers a eu lieu à La Rogère pendant la Poche de Saint-Nazaire. Andrew Hodges, capitaine de la Croix-Rouge américaine, participa aux négociations.','Observer la croix et le panneau commémoratif du site.','Le panneau historique du Chemin de la Mémoire permet de retrouver plusieurs réponses.',['29 novembre 1944','54 contre 54','Andrew Hodges','Poche de Saint-Nazaire'],[

async function prep(id){UI.rid=id;const r=route();UI.questions=[];UI.qIndex=0;UI.stopIndex=0;UI.activeStop=null;UI.completedStops=[];UI.revealed=false;UI.players=[];UI.pin=makePin();UI.view='lobby';render();if(!SB){toast('Connexion live indisponible');return}try{let created=null;for(let i=0;i<5&&!created;i++){UI.pin=makePin();const payload={pin:UI.pin,title:r.name,status:'lobby',current_question:0,state:{questions:[],rules:r.rules||[],settings:r.settings||{},routeName:r.name,between_stops:true}};const {data,error}=await SB.from('guide_sessions').insert(payload).select().single();if(!error)created=data}if(!created)throw new Error('Impossible de créer la session');UI.liveSession=created;await subscribeHost();render()}catch(e){console.error(e);toast('Session live impossible — réessaie')}}

async function startStop(si){const r=route(),st=r.steps[si];UI.activeStop=si;UI.stopIndex=si;UI.questions=(st.bank||[]).map((g,gi)=>{const q={...g,stop:st.name,si,gi};const opts=normalizeOptions(q);for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}q.opts=opts;return q});if(r.settings?.shuffle){for(let i=UI.questions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[UI.questions[i],UI.questions[j]]=[UI.questions[j],UI.questions[i]]}}UI.qIndex=0;UI.revealed=false;UI.selected=null;UI.view='question';if(UI.liveSession&&SB)await SB.from('guide_sessions').update({status:'question',current_question:0,state:{questions:UI.questions,rules:r.rules||[],settings:r.settings||{},routeName:r.name,stopName:st.name,question_started_at:Date.now(),between_stops:false}}).eq('id',UI.liveSession.id);startTimer();render()}
function normalizeOptions(g){let opts=[...(g.opts||[])];if((g.type==='vf'||/vrai|faux/i.test(g.type))&&!opts.length)opts=['Vrai','Faux'];if(g.type==='est'&&!opts.length)return[];if(!opts.length&&g.ans)opts=[g.ans,'Je ne sais pas'];if(g.ans&&!opts.some(x=>String(x).trim().toLowerCase()===String(g.ans).trim().toLowerCase()))opts.unshift(g.ans);return opts.slice(0,4)}

function question(){const g=current(),opts=normalizeOptions(g);const special=!opts.length;return `<div class="screen stage"><div class="qtop"><div class="qnum">${UI.qIndex+1} / ${UI.questions.length}</div><div class="score-mini">📍 ${esc(g.stop||'Étape')}</div></div><div class="question-wrap"><div class="question"><div>${esc(g.q)}${g.image?`<img class="preview-question-img" src="${g.image}" alt="Image de la question" onerror="this.style.display='none'">`:''}<div><small>${esc(TYPES[g.type]?.[0]||'Question')}</small></div></div></div>${special?`<div class="choice-empty"><b>Question ouverte / estimation</b><br>${esc(g.ans?'Le guide valide la réponse.':'Le guide désigne le gagnant.')}</div>`:`<div class="gamegrid">${opts.map((o,i)=>`<button class="answer ${COLORS[i]} ${UI.revealed?(same(o,g.ans)?'correct':'wrong'):''}" ${UI.revealed?'disabled':''} onclick="pickAnswer(${i})"><span class="shape">${SHAPES[i]}</span>${esc(o)}</button>`).join('')}</div>`}<div class="timerrow"><div class="timer" id="timer">${UI.time}</div><div class="responses">${UI.revealed?'Réponse révélée':'Le groupe répond maintenant'}</div></div><div class="host-controls">${UI.revealed?`${UI.liveSession?'':`<button class="btn light" onclick="awardModal()">🏆 Attribuer les points</button>`}<button class="btn dark" onclick="showExplanation()">Explication</button><button class="btn purplebtn" onclick="nextQuestion()">Suivant ▶</button>`:`<button class="btn dark" onclick="reveal()">Afficher la réponse</button><button class="btn light" onclick="skipQuestion()">Passer</button>`}</div></div></div>`}

function confetti(){const c=$('#confetti');c.innerHTML='';for(let i=0;i<90;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=['#e21b3c','#1368ce','#d89e00','#26890c','#fff'][i%5];e.style.animationDuration=(2+Math.random()*3)+'s';e.style.animationDelay=(Math.random()*.8)+'s';c.appendChild(e)}setTimeout(()=>c.innerHTML='',6000)}

function openCreator(id){UI.rid=id;const r=route();r.rules=r.rules||['Respecter les consignes du guide','Une seule réponse par équipe','Le guide tranche en cas de doute'];r.settings=r.settings||{streak:true,speedBonus:true,shuffle:false};UI.view='creator';render()}
function creator(){const r=route();if(!r)return home();r.rules=r.rules||[];r.settings=r.settings||{streak:true,speedBonus:true,shuffle:false};return `<div class="screen creator"><div class="creator-wrap"><div class="creator-head"><div><div class="creator-title">✏️ ${esc(r.name)}</div><div class="helper">Éditeur mobile • ${collectQuestions(r).length} questions</div></div><div class="creator-actions"><button class="btn light" onclick="UI.view='home';render()">← Accueil</button><button class="btn purplebtn" onclick="save();toast('Quiz enregistré')">Enregistrer</button></div></div>
<div class="edit-card"><h3>🎮 Paramètres de la partie</h3><div class="toggleline"><span>Bonus de rapidité</span><button class="switch ${r.settings.speedBonus?'on':''}" onclick="toggleSetting('speedBonus')"><i></i></button></div><div class="toggleline"><span>Séries 🔥</span><button class="switch ${r.settings.streak?'on':''}" onclick="toggleSetting('streak')"><i></i></button></div><div class="toggleline"><span>Mélanger les questions au lancement</span><button class="switch ${r.settings.shuffle?'on':''}" onclick="toggleSetting('shuffle')"><i></i></button></div></div>
<div class="edit-card"><h3>📜 Règles</h3><p class="helper">Tu peux écrire les règles que tu annonces au groupe avant de commencer.</p><div id="rules">${r.rules.map((x,i)=>`<div class="rule"><input value="${esc(x)}" oninput="setRule(${i},this.value)"><button class="btn red" onclick="delRule(${i})">×</button></div>`).join('')}</div><button class="btn light full" onclick="addRule()">+ Ajouter une règle</button></div>
<div class="edit-card"><h3>❓ Questions par étape</h3>${(r.steps||[]).map((st,si)=>`<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(st.name)}</b><button class="btn light" onclick="newQuestion(${si})">+ Question</button></div>${(st.bank||[]).length?(st.bank||[]).map((q,qi)=>`<div class="qedit"><div class="qbadge">${qi+1}</div><div class="qtext"><b>${esc(q.q||'Question sans titre')}</b><span>${esc(TYPES[q.type]?.[0]||q.type||'QCM')} • ${Number(q.time||20)} s • ${Number(q.points||q.pts||1)} pts ${q.image?' • 📷':''}</span></div><div class="qactions"><button class="smallbtn" onclick="moveQ(${si},${qi},-1)">↑</button><button class="smallbtn" onclick="moveQ(${si},${qi},1)">↓</button><button class="smallbtn" onclick="editQuestion(${si},${qi})">✏️</button><button class="dangerbtn" onclick="deleteQuestion(${si},${qi})">🗑</button></div></div>`).join(''):`<div class="emptyedit">Aucune question à cette étape.</div>`}</div>`).join('')}</div>
<div class="creator-actions" style="padding-bottom:20px"><button class="btn dark full" onclick="prep('${r.id}')">▶ Tester ce quiz</button></div></div></div>`}
function toggleSetting(k){const r=route();r.settings=r.settings||{};r.settings[k]=!r.settings[k];save();render()}
function setRule(i,v){route().rules[i]=v;save()}
function addRule(){route().rules.push('Nouvelle règle');save();render()}
function delRule(i){route().rules.splice(i,1);save();render()}
function newQuestion(si){const st=route().steps[si];st.bank=st.bank||[];st.bank.push({type:'qcm',q:'Nouvelle question',ans:'Réponse 1',opts:['Réponse 1','Réponse 2','Réponse 3','Réponse 4'],expl:'',src:'',time:20,points:1,image:''});save();editQuestion(si,st.bank.length-1)}
function editQuestion(si,qi){UI.editStep=si;UI.editQ=qi;const q=route().steps[si].bank[qi];q.time=q.time||20;q.points=q.points||q.pts||1;q.opts=q.opts||[];if(q.type==='vf'&&!q.opts.length)q.opts=['Vrai','Faux'];while(q.opts.length<4)q.opts.push('');$('#modal').innerHTML=`<div class="modal"><div class="modalbox"><h2>Modifier la question</h2><div class="field"><label>Type</label><select id="qeType"><option value="qcm" ${q.type==='qcm'?'selected':''}>Quiz 4 réponses</option><option value="vf" ${q.type==='vf'?'selected':''}>Vrai / Faux</option></select></div><div class="field"><label>Question</label><textarea id="qeQ" rows="3">${esc(q.q)}</textarea></div><div class="field"><label>Photo</label><input type="file" id="qeFile" accept="image/*"><input id="qeImage" value="${esc(q.image||'')}" placeholder="Ou colle une URL d’image"><div class="helper">Sur iPhone, touche “Choisir un fichier” pour prendre une photo ou utiliser ta photothèque.</div>${q.image?`<img id="qePreview" class="media-preview" src="${q.image}" alt="Aperçu">`:`<img id="qePreview" class="media-preview hidden" alt="Aperçu">`}</div><div class="seg"><div class="field"><label>Chrono (secondes)</label><input id="qeTime" type="number" min="5" max="180" value="${Number(q.time||20)}"></div><div class="field"><label>Points max</label><input id="qePoints" type="number" min="0" max="10000" step="100" value="${Number(q.points||q.pts||1)}"></div></div><h3>Réponses</h3>${[0,1,2,3].map(i=>`<div class="optrow"><div class="optcolor ${COLORS[i]}">${SHAPES[i]}</div><input id="qeOpt${i}" value="${esc(q.opts[i]||'')}" placeholder="Réponse ${i+1}"></div>`).join('')}<div class="field"><label>Bonne réponse exacte</label><input id="qeAns" value="${esc(q.ans||'')}"></div><div class="field"><label>Explication après la réponse</label><textarea id="qeExpl" rows="3">${esc(q.expl||'')}</textarea></div><div class="field"><label>Règle / consigne spéciale pour cette question</label><textarea id="qeRule" rows="2">${esc(q.rule||'')}</textarea></div><div class="seg"><button class="btn light" onclick="closeModal()">Annuler</button><button class="btn purplebtn" onclick="saveQuestion()">Enregistrer</button></div></div></div>`;const f=$('#qeFile');f.addEventListener('change',handleQuestionImage)}
function handleQuestionImage(e){const file=e.target.files?.[0];if(!file)return;if(file.size>2500000){toast('Photo trop lourde : choisis une image de moins de 2,5 Mo');return}const rd=new FileReader();rd.onload=()=>{const v=String(rd.result||'');$('#qeImage').value=v;const im=$('#qePreview');im.src=v;im.classList.remove('hidden')};rd.readAsDataURL(file)}
function saveQuestion(){const q=route().steps[UI.editStep].bank[UI.editQ];q.type=$('#qeType').value;q.q=$('#qeQ').value.trim()||'Question';q.image=$('#qeImage').value.trim();q.time=Math.max(5,Math.min(180,Number($('#qeTime').value)||20));q.points=Math.max(0,Math.min(10000,Number($('#qePoints').value)||1000));q.pts=q.points;q.opts=[0,1,2,3].map(i=>$('#qeOpt'+i).value.trim()).filter(Boolean);q.ans=$('#qeAns').value.trim();q.expl=$('#qeExpl').value.trim();q.rule=$('#qeRule').value.trim();save();closeModal();render();toast('Question enregistrée')}
function deleteQuestion(si,qi){if(!confirm('Supprimer cette question ?'))return;route().steps[si].bank.splice(qi,1);save();render()}
function moveQ(si,qi,d){const a=route().steps[si].bank,n=qi+d;if(n<0||n>=a.length)return;[a[qi],a[n]]=[a[n],a[qi]];save();render()}
function showRules(){const r=route();if(!(r.rules||[]).length)return startGame();$('#modal').innerHTML=`<div class="modal"><div class="modalbox"><h2>📜 Règles de la partie</h2>${r.rules.filter(Boolean).map((x,i)=>`<div class="revealbox" style="text-align:left"><b>${i+1}.</b> ${esc(x)}</div>`).join('')}<div style="height:12px"></div><button class="btn purplebtn full" onclick="closeModal();startGame()">C’est parti ▶</button></div></div>`}

function openSettings(){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><h2>Réglages</h2><p>Cette version reprend tes données de l’ancien Carnet de guide et les convertit en jeu live façon Kahoot.</p><button class="btn light full" onclick="exportData()">Exporter mes données</button><div style="height:8px"></div><button class="btn red full" onclick="if(confirm('Réinitialiser avec les données d’origine ?')){DATA=seed();save();closeModal();render()}">Réinitialiser</button></div></div>`}
function exportData(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='guide-quiz-data.json';a.click();URL.revokeObjectURL(a.href)}
async function bootClient(pin){if(!SB)return;UI.client=true;UI.pin=String(pin||'').replace(/\D/g,'').slice(0,6);localStorage.setItem('guideClientMode','1');localStorage.setItem('guideClientPin',UI.pin);render();const {data,error}=await SB.from('guide_sessions').select('*').eq('pin',UI.pin).gt('expires_at',new Date().toISOString()).maybeSingle();if(error||!data){UI.clientMessage='Session introuvable ou expirée';render();return}UI.clientSession=data;const savedId=localStorage.getItem('guideClientPlayer:'+UI.pin);if(savedId){const {data:player}=await SB.from('guide_players').select('*').eq('id',savedId).eq('session_id',data.id).maybeSingle();if(player)UI.clientPlayer=player}await subscribeClient();render()}
function clientJoinView(){return `<div class="client-shell"><div class="client-card"><span class="statuspill">SESSION ${esc(UI.pin||'')}</span><h1 style="margin-top:12px">Rejoindre la partie</h1>${UI.clientMessage?`<div class="answer-result">${esc(UI.clientMessage)}</div>`:''}<div class="field"><label>Ton prénom</label><input id="clientName" maxlength="32" autocomplete="name" placeholder="Ex : Lucas"></div><button class="btn purplebtn full" onclick="clientJoin()">Rejoindre</button></div></div>`}
async function clientJoin(){const name=($('#clientName')?.value||'').trim();if(name.length<1)return toast('Entre ton prénom');const {data,error}=await SB.from('guide_players').insert({session_id:UI.clientSession.id,name}).select().single();if(error){UI.clientMessage=String(error.message||'').includes('unique')?'Ce prénom est déjà pris':'Impossible de rejoindre';render();return}UI.clientPlayer=data;localStorage.setItem('guideClientPlayer:'+UI.pin,data.id);UI.clientAnswered=false;render()}
async function subscribeClient(){if(!UI.clientSession||!SB)return;if(UI.liveChannel)SB.removeChannel(UI.liveChannel);UI.liveChannel=SB.channel('guide-client-'+UI.clientSession.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'guide_sessions',filter:'id=eq.'+UI.clientSession.id},async payload=>{UI.clientSession=payload.new;UI.clientAnswered=false;if(UI.clientPlayer){const {data}=await SB.from('guide_players').select('*').eq('id',UI.clientPlayer.id).maybeSingle();if(data)UI.clientPlayer=data}render()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'guide_players',filter:'session_id=eq.'+UI.clientSession.id},payload=>{if(UI.clientPlayer&&payload.new.id===UI.clientPlayer.id){UI.clientPlayer=payload.new;render()}}).subscribe()}
function clientPlayView(){const s=UI.clientSession,p=UI.clientPlayer;if(!s)return clientJoinView();if(!p)return clientJoinView();const st=s.state||{},qs=st.questions||[],g=qs[s.current_question]||{},opts=normalizeOptions(g),status=s.status;let body='';if(status==='lobby')body=`<h2>Étape terminée ✅</h2><div class="client-name">${esc(p.name)}</div><p>Tes points sont enregistrés. Tu peux ranger ton téléphone : le prochain quiz s’affichera automatiquement quand le guide le lancera.</p><div class="bigscore">${p.score||0}</div><p>points cumulés</p>`;else if(status==='finished')body=`<h2>Sortie terminée 🏁</h2><div class="bigscore">${p.score||0}</div><p>points</p>`;else if(status==='board')body=`<h2>Classement intermédiaire</h2><div class="bigscore">${p.score||0}</div><p>points</p>`;else if(status==='question'||status==='reveal'){body=`<span class="statuspill">QUESTION ${Number(s.current_question)+1}/${qs.length}</span><h2 style="margin-top:12px">${esc(g.q||'Question')}</h2>${g.image?`<img class="preview-question-img" src="${g.image}" alt="Image de la question" onerror="this.style.display='none'">`:''}${opts.length?`<div class="client-answers">${opts.map((o,i)=>`<button class="client-answer ${COLORS[i]}" ${UI.clientAnswered||status==='reveal'?'disabled':''} onclick="clientAnswer(${i})">${SHAPES[i]} ${esc(o)}</button>`).join('')}</div>`:`<div class="answer-result">Question ouverte : donne ta réponse au guide.</div>`}${UI.clientAnswered?`<div class="answer-result">Réponse envoyée ✅</div>`:''}${status==='reveal'?`<div class="answer-result"><b>Bonne réponse : ${esc(g.ans||'Réponse libre')}</b>${g.expl?`<br>${esc(g.expl)}`:''}</div>`:''}`}
return `<div class="client-shell"><div class="client-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="client-name">${esc(p.name)}</span><span class="statuspill">${p.score||0} pts</span></div><div style="height:14px"></div>${body}</div></div>`}
async function clientAnswer(i){if(UI.clientAnswered||!UI.clientPlayer||!UI.clientSession)return;const s=UI.clientSession,st=s.state||{},g=(st.questions||[])[s.current_question]||{},opts=normalizeOptions(g),ans=opts[i];UI.clientAnswered=true;render();const started=Number(st.question_started_at||Date.now()),elapsed=Math.max(0,Date.now()-started);const correct=same(ans,g.ans);let score=Number(UI.clientPlayer.score||0),streak=Number(UI.clientPlayer.streak||0);if(correct){const base=Math.max(1,Number(g.points||g.pts||1));score+=base;streak+=1}else streak=0;await SB.from('guide_answers').upsert({session_id:s.id,player_id:UI.clientPlayer.id,question_index:s.current_question,answer:String(ans??''),elapsed_ms:elapsed},{onConflict:'session_id,player_id,question_index'});const {data}=await SB.from('guide_players').update({score,streak}).eq('id',UI.clientPlayer.id).select().single();if(data)UI.clientPlayer=data;render()}
function render(){const app=$('#app');if(UI.client){app.innerHTML=clientPlayView();return}app.innerHTML=UI.view==='home'?home():UI.view==='creator'?creator():UI.view==='lobby'?lobby():UI.view==='stopselect'?stopSelect():UI.view==='question'?question():UI.view==='board'?board():podium();save()}
const params=new URLSearchParams(location.search);const initialJoin=params.get('join');const rememberedClient=localStorage.getItem('guideClientMode')==='1'?localStorage.getItem('guideClientPin'):null;if(initialJoin)bootClient(initialJoin);else if(rememberedClient){history.replaceState(null,'',joinBase()+'?join='+encodeURIComponent(rememberedClient));bootClient(rememberedClient)}else render();</script></body></html>
